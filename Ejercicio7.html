<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Página Simple</title>
</head>
<body>

<!-- 1. Cabecera -->
<header>
    <h1>Mi Tienda Online</h1>
</header>

<!-- 2. Menú -->
<nav>
    <a href="#">Inicio</a> | <a href="#">Contacto</a>
</nav>

<!-- 3. Contenido principal -->
<main>

    <!-- 4. Sección temática -->
    <section>
        <h2>Noticias</h2>

        <!-- 5. Artículo independiente -->
        <article>
            <h3>Título de la noticia</h3>
            <p>Texto de la noticia...</p>
        </article>
    </section>

    <!-- 6. Barra lateral (contenido secundario) -->
    <aside>
        <p>Publicidad</p>
    </aside>

</main>

<!-- 7. Pie de página -->
<footer>
    <p>&copy; 2026 Mi Sitio</p>
</footer>

</body>
</html>
