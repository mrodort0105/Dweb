<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo Directo</title>
</head>
<body>

<!-- ==================== 1. CABECERA ==================== -->
<header>
    <!-- CONCEPTUAL: Plano horizontal superior -->
    <!-- VISUAL: Rectángulo grande con el logo y color de marca -->
    <!-- RELACIONAL: Ubicado en la parte superior (inicio de lectura) -->
    <!-- PRÁCTICO: Muestra la identidad y título de la web -->
    <h1>Mi Sitio Web</h1>
</header>


<!-- ==================== 2. NAVEGACIÓN ==================== -->
<nav>
    <!-- CONCEPTUAL: Línea orientativa de puntos de anclaje -->
    <!-- VISUAL: Botones/enlaces con color en contraste -->
    <!-- RELACIONAL: Posición inmediatamente debajo del header -->
    <!-- PRÁCTICO: Función de menú para cambiar de página -->
    <a href="#">Inicio</a> | <a href="#">Contacto</a>
</nav>


<!-- ==================== 3. CONTENIDO PRINCIPAL ==================== -->
<main>
    <!-- CONCEPTUAL: Plano central que da volumen y cuerpo -->
    <!-- VISUAL: Área de mayor tamaño en la pantalla -->
    <!-- RELACIONAL: Centro de atención con mayor peso visual -->
    <!-- PRÁCTICO: Contiene el tema clave y único de la web -->

    <!-- SECCIÓN TEMÁTICA -->
    <section>
        <!-- CONCEPTUAL: Sub-plano de agrupar contenido -->
        <!-- VISUAL: Encabezado h2 para jerarquía visual -->
        <h2>Noticias</h2>

        <!-- ARTÍCULO INDEPENDIENTE -->
        <article>
            <!-- CONCEPTUAL: Módulo o tarjeta independiente -->
            <!-- VISUAL: Borde o fondo ligero simula textura de tarjeta -->
            <!-- PRÁCTICO: Noticia o post reutilizable por sí solo -->
            <h3>Título de la noticia</h3>
            <p>Texto de la noticia...</p>
        </article>
    </section>

    <!-- BARRA LATERAL (CONTENIDO AUXILIAR) -->
    <aside>
        <!-- CONCEPTUAL: Plano lateral secundario -->
        <!-- VISUAL: Bloque más estrecho al lado del contenido -->
        <!-- RELACIONAL: Equilibra el espacio negativo a la derecha -->
        <!-- PRÁCTICO: Muestra publicidad o contenido secundario -->
        <p>Publicidad</p>
    </aside>

</main>


<!-- ==================== 4. PIE DE PÁGINA ==================== -->
<footer>
    <!-- CONCEPTUAL: Plano horizontal inferior de cierre -->
    <!-- VISUAL: Franja oscura con texto pequeño -->
    <!-- RELACIONAL: Posición en la base de la página (cierre visual) -->
    <!-- PRÁCTICO: Datos de autoría, derechos y contacto -->
    <p>&copy; 2026 Mi Sitio</p>
</footer>

</body>
</html>
