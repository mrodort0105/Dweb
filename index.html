<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desarrollo Web - Ejercicios</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 20px;
        }

        header h1 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 8px;
        }

        header p {
            color: #7f8c8d;
            font-size: 15px;
        }

        .temas-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .tema-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            background-color: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .tema-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            border-color: #3498db;
        }

        .tema-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .tema-num {
            background-color: #3498db;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
        }

        .tema-titulo {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
        }

        .btn-ver {
            background-color: #e8f4fc;
            color: #3498db;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
        }
